            correct: "d",
            aiAnalysis: {
              correct: "تكررت عبارة: 'too much technology can be bad' و 'too much digital use' في مواضع متعددة.",
              distractors: {
                a: "خطأ: القليل الكافي ليس ضاراً.",
                b: "خطأ: المقدار القليل غير مقصود بالسياق التحذيري.",
                c: "خطأ: التركيز على الإفراط والزيادة (too much)."
              }
            }
          },
          {
            q: "7. Restricting the hours we spend with screens is hard at first for .....",
            options: [
              { key: "a", text: "fear of missing anything important" },
              { key: "b", text: "getting addicted to it." },
              { key: "c", text: "not having enough time to do everything" },
              { key: "d", text: "preventing people from developing bad habits." }
            ],
            correct: "b",
            aiAnalysis: {
              correct: "صعوبة قطع أو تقليل الشاشات في البداية ترجع إلى التعود والإدمان الرقمي الشديد الذي تشكل كعادة سيئة متجذرة.",
              distractors: {
                a: "خطأ: لم تتحدث القطعة عن ظاهرة الخوف من فوات الأخبار (FOMO) بهذا التعبير.",
                c: "خطأ: التقليل يوفر الوقت بدلاً من ضيقه.",
                d: "خطأ: منع العادات السيئة هو النتيجة المرجوة وليس سبب الصعوبة."
              }
            }
          },
          {
            q: "8. Which one summarizes the passage?",
            options: [
              { key: "a", text: "A digital diet stops us wasting out times online." },
              { key: "b", text: "Parents must limit their children's use for digital device" },
              { key: "c", text: "A digital diet develops creativity." },
              { key: "d", text: "We shouldn't depend on technology all the time." }
            ],
            correct: "d",
            aiAnalysis: {
              correct: "الملخص الأعم والأشمل: عدم الاعتماد الكلي والدائم على التكنولوجيا وتحقيق التوازن الحياتي.",
              distractors: {
                a: "خطأ: إيقاف تضييع الوقت تفصيلة وليست الفكرة الجامعة لكل الجوانب الصحية والاجتماعية.",
                b: "خطأ: القطعة موجهة للجميع وليس للآباء وأطفالهم فقط.",
                c: "خطأ: تنمية الإبداع فائدة فرعية ذُكرت في فقرة واحدة فقط."
              }
            }
          }
        ]
      }
    ];

    // State
    let currentPassageIndex = 0;
    let currentQuestionIndex = 0;
    let userAnswers = {}; // { qIndex: { chosenKey, isCorrect } }
    let score = 0;

    // Elements
    const passageSelect = document.getElementById("passageSelect");
    const passageBadge = document.getElementById("passageBadge");
    const passageText = document.getElementById("passageText");
    const vocabContainer = document.getElementById("vocabContainer");
    const currentQDisplay = document.getElementById("currentQDisplay");
    const progressBar = document.getElementById("progressBar");
    const scoreDisplay = document.getElementById("scoreDisplay");
    const qText = document.getElementById("qText");
    const optionsContainer = document.getElementById("optionsContainer");
    const aiExplanation = document.getElementById("aiExplanation");
    const explanationTitle = document.getElementById("explanationTitle");
    const explanationBody = document.getElementById("explanationBody");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");

    // Init Passages Dropdown
    function initDropdown() {
      passageSelect.innerHTML = passagesData.map((p, idx) => `
        <option value="${idx}">القطعة ${p.id}: ${p.title.split(':')[1] || ''}</option>
      `).join("");
    }

    // Load Passage
    function loadPassage(idx) {
      currentPassageIndex = idx;
      currentQuestionIndex = 0;
      userAnswers = {};
      score = 0;
      scoreDisplay.textContent = "0";

      const p = passagesData[idx];
      passageBadge.textContent = `القطعة ${p.id}`;
      passageText.innerHTML = p.text.split('\n\n').map(par => `<p class="mb-3">${par}</p>`).join("");

      // Render Vocab
      vocabContainer.innerHTML = p.vocab.map(v => `
        <div class="bg-indigo-50/60 p-2 rounded-lg border border-indigo-100 flex flex-col">
          <span class="font-bold text-indigo-900 en-text text-xs">${v.en}</span>
          <span class="text-slate-600 text-[11px] font-medium mt-0.5">${v.ar}</span>
        </div>
      `).join("");

      loadQuestion(0);
    }

    function changePassage(val) {
      loadPassage(parseInt(val));
    }

    // Load Question
    function loadQuestion(qIdx) {
      currentQuestionIndex = qIdx;
      const p = passagesData[currentPassageIndex];
      const qData = p.questions[qIdx];

      // Update progress
      currentQDisplay.textContent = `${qIdx + 1} من ${p.questions.length}`;
      const progressPercent = ((qIdx + 1) / p.questions.length) * 100;
      progressBar.style.width = `${progressPercent}%`;

      // Set Text
      qText.textContent = qData.q;

      // Check if already answered
      const answeredState = userAnswers[qIdx];

      // Render Options
      optionsContainer.innerHTML = qData.options.map(opt => {
        let btnClasses = "w-full text-left p-3.5 rounded-xl border border-slate-200 text-sm font-medium transition duration-150 flex items-center justify-between";
        
        if (!answeredState) {
          btnClasses += " hover:bg-indigo-50/70 hover:border-indigo-300 active:scale-[0.99] bg-white";
        } else {
          // Already answered
          if (opt.key === qData.correct) {
            btnClasses += " bg-emerald-50 border-emerald-500 text-emerald-900 font-bold";
          } else if (opt.key === answeredState.chosenKey) {
            btnClasses += " bg-rose-50 border-rose-400 text-rose-900 font-bold";
          } else {
            btnClasses += " bg-slate-50 border-slate-200 text-slate-400 opacity-60";
          }
        }

        const disabledAttr = answeredState ? "disabled" : "";

        return `
          <button onclick="handleSelectOption('${opt.key}')" ${disabledAttr} class="${btnClasses}">
            <div class="flex items-center gap-3">
              <span class="w-6 h-6 rounded-full border border-slate-300 flex items-center justify-center text-xs font-bold text-slate-500 ${answeredState && opt.key === qData.correct ? 'border-emerald-500 text-emerald-600 bg-emerald-100' : ''}">
                ${opt.key.toUpperCase()}
              </span>
              <span>${opt.text}</span>
            </div>
            ${answeredState && opt.key === qData.correct ? '<span class="text-emerald-600 font-bold text-xs">✓ صحيح</span>' : ''}
            ${answeredState && opt.key === answeredState.chosenKey && !answeredState.isCorrect ? '<span class="text-rose-500 font-bold text-xs">✕ اختيارك</span>' : ''}
          </button>
        `;
      }).join("");

      // Render AI Explanation if answered
      if (answeredState) {
        showExplanation(qData, answeredState);
      } else {
        aiExplanation.classList.add("hidden");
      }

      // Manage Nav Buttons
      prevBtn.disabled = qIdx === 0;
      nextBtn.textContent = qIdx === p.questions.length - 1 ? "إنهاء القطعة" : "التالي";
    }

    // Handle Option Selection
    function handleSelectOption(chosenKey) {
      const p = passagesData[currentPassageIndex];
      const qData = p.questions[currentQuestionIndex];
      const isCorrect = chosenKey === qData.correct;

      if (isCorrect) {
        score++;
        scoreDisplay.textContent = score;
      }

      userAnswers[currentQuestionIndex] = {
        chosenKey,
        isCorrect
      };

      // Reload view with answers highlighted
      loadQuestion(currentQuestionIndex);
    }

    // Display AI Reasoning & Distractor Analysis
    function showExplanation(qData, answerState) {
      aiExplanation.classList.remove("hidden");

      if (answerState.isCorrect) {
        aiExplanation.className = "mt-5 p-4 rounded-xl border border-emerald-200 bg-emerald-50/50";
        explanationTitle.className = "text-sm font-bold text-emerald-800";
        explanationTitle.innerHTML = "✨ إجابة صحيحة وموفقة! تحليل الذكاء الاصطناعي:";
      } else {
        aiExplanation.className = "mt-5 p-4 rounded-xl border border-amber-200 bg-amber-50/50";
        explanationTitle.className = "text-sm font-bold text-amber-900";
        explanationTitle.innerHTML = "⚠️ إجابة غير دقيقة! إليك التفنيد والتحليل الذكي:";
      }

      let distractorsHtml = "";
      for (const [key, reason] of Object.entries(qData.aiAnalysis.distractors)) {
        const isUserMistake = (key === answerState.chosenKey);
        distractorsHtml += `
          <div class="p-2 rounded-lg text-[11px] ${isUserMistake ? 'bg-rose-100/70 border border-rose-300 font-semibold text-rose-900' : 'bg-white/80 text-slate-600 border border-slate-200'}">
            <span class="font-bold uppercase tracking-wide">الخيار (${key}):</span> ${reason}
            ${isUserMistake ? ' <span class="text-rose-600 font-bold underline">(هذا هو الخيار الذي حددته)</span>' : ''}
          </div>
        `;
      }

      explanationBody.innerHTML = `
        <div class="p-2.5 rounded-lg bg-white border border-slate-200">
          <p class="text-emerald-800 font-bold mb-1 text-xs">💡 لماذا الاختيار (${qData.correct.toUpperCase()}) هو الصحيح دقيقاً؟</p>
          <p class="text-slate-700 text-xs">${qData.aiAnalysis.correct}</p>
        </div>
        <div class="mt-2 space-y-1.5">
          <p class="font-bold text-slate-700 text-xs">تحليل الخيارات الخاطئة ولماذا استبعدناها:</p>
          ${distractorsHtml}
        </div>
      `;
    }

    function prevQuestion() {
      if (currentQuestionIndex > 0) {
        loadQuestion(currentQuestionIndex - 1);
      }
    }

    function nextQuestion() {
      const p = passagesData[currentPassageIndex];
      if (currentQuestionIndex < p.questions.length - 1) {
        loadQuestion(currentQuestionIndex + 1);
      } else {
        alert(`أحسنت! لقد أكملت حل القطعة.\nدرجتك النهائية: ${score} من أصل ${p.questions.length}`);
      }
    }

    // Startup
    window.addEventListener('DOMContentLoaded', () => {
      initDropdown();
      loadPassage(0);
    });
  </script>
</body>
</html>
